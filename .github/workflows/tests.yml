name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            certbot: 'certbot==2.11.*'
            acme: 'acme==2.11.*'
          - python: '3.12'
            certbot: 'certbot>=5,<6'
            acme: 'acme>=5,<6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e packages/core -e . pytest build '${{ matrix.certbot }}' '${{ matrix.acme }}'
      - run: python -m pytest -q
      - run: certbot plugins --prepare --config-dir /tmp/certbot-config --work-dir /tmp/certbot-work --logs-dir /tmp/certbot-logs --certbot-httpreq:auth-config "$PWD/certbot-httpreq.yml" --certbot-httpreq:installer-config "$PWD/certbot-httpreq.yml"
      - run: python -m build packages/core
      - run: python -m build
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ./packages/core pytest
      - run: python -m pytest -q tests/test_core.py
      - run: python -c "import importlib.util; assert importlib.util.find_spec('certbot') is None; assert importlib.util.find_spec('acme') is None"
