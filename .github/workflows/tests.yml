name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            certbot: 'certbot==2.11.*'
            acme: 'acme==2.11.*'
          - python: '3.12'
            certbot: 'certbot>=5,<6'
            acme: 'acme>=5,<6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e packages/core -e . build twine '${{ matrix.certbot }}' '${{ matrix.acme }}'
      - name: Verify collection and run every unit test
        run: |
          python .github/scripts/check-test-collection.py --runner unittest tests/core tests/certbot
          python -m unittest discover -s tests/core -v
          python -m unittest discover -s tests/certbot -v
      - run: certbot plugins --prepare --config-dir /tmp/certbot-config --work-dir /tmp/certbot-work --logs-dir /tmp/certbot-logs --certbot-httpreq:auth-config "$PWD/certbot-httpreq.yml" --certbot-httpreq:installer-config "$PWD/certbot-httpreq.yml"
      - run: python -m build packages/core
      - run: python -m build
      - run: python -m twine check --strict packages/core/dist/* dist/*
      - name: Install built wheels
        run: python -m pip install --force-reinstall --no-deps packages/core/dist/*.whl dist/*.whl
      - name: Install pinned ACME test fixtures
        run: bash .github/scripts/install-acme-test-tools.sh "$RUNNER_TEMP/acme-tools"
      - name: Real issuance, renewal and failed validation with both clients
        working-directory: ${{ runner.temp }}
        run: >-
          python "$GITHUB_WORKSPACE/scripts/check_acme_clients.py"
          --pebble "$RUNNER_TEMP/acme-tools/pebble"
          --challtestsrv "$RUNNER_TEMP/acme-tools/pebble-challtestsrv"
          --dehydrated "$RUNNER_TEMP/acme-tools/dehydrated/dehydrated"
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ./packages/core
      - name: Check standalone core and hook without Certbot
        run: |
          python .github/scripts/check-test-collection.py --runner unittest tests/core
          python -m unittest discover -s tests/core -v
          acme-http-dehydrated startup_hook
      - run: python -c "import importlib.util; assert importlib.util.find_spec('certbot') is None; assert importlib.util.find_spec('acme') is None"
