name: Publish to PyPI

on:
  push:
    branches: [release/publish-0.0.25]
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: python -m pip install -e packages/core -e . build twine -r docs/requirements.txt
      - name: Check release version
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || 'v0.0.25' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          version = Path('VERSION').read_text().strip()
          metadata = yaml.safe_load(Path('setup.yml').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match VERSION'
          assert metadata['name'] == 'certbot-httpreq', 'Unexpected package name'
          assert metadata['version'] == metadata['release'] == version
          assert Path('RELEASE').read_text().strip() == version
          assert 'UNRELEASED' not in Path('CHANGELOG').read_text().splitlines()[0], 'Finalize changelog before publishing'
          PY
      - name: Test
        run: |
          python .github/scripts/check-test-collection.py --runner unittest tests
          python -m unittest discover -s tests -v
      - name: Rebuild release documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: html-documentation
          path: docs/_build/html/
          if-no-files-found: error
      - name: Build distributions
        run: |
          python -m build packages/core --outdir dist/core
          python -m build --outdir dist/adapter
      - name: Validate distributions
        run: python -m twine check --strict dist/core/* dist/adapter/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/release/publish-0.0.25')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish the approved merge as a GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/git/ref/heads/master --jq .object.sha)" = "$GITHUB_SHA"
          test "$(cat VERSION)" = '0.0.25'
          if gh release view v0.0.25 --json targetCommitish --jq .targetCommitish > release-target.txt; then
            test "$(cat release-target.txt)" = "$GITHUB_SHA"
          else
            python - <<'PYNOTES'
          from pathlib import Path
          changelog = Path('CHANGELOG').read_text()
          Path('release-notes.txt').write_text(changelog.split('\ncertbot-httpreq (', 1)[0])
          PYNOTES
            gh release create v0.0.25 --target "$GITHUB_SHA" --title 'Certbot adapter 0.0.25 / core 0.2.2' --notes-file release-notes.txt
          fi

  publish-core:
    if: (github.event_name == 'release' && !github.event.release.prerelease || github.event_name == 'push' && github.ref == 'refs/heads/release/publish-0.0.25') && github.repository == 'decryptus/acme-http-connector'
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/acme-http-connector/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core/

  publish-adapter:
    if: (github.event_name == 'release' && !github.event.release.prerelease || github.event_name == 'push' && github.ref == 'refs/heads/release/publish-0.0.25') && github.repository == 'decryptus/acme-http-connector'
    needs: publish-core
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/certbot-httpreq/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish adapter using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/adapter/
