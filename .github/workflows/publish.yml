name: Publish to PyPI

on:
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: python -m pip install -e packages/core -e . build twine
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          version = Path('VERSION').read_text().strip()
          metadata = yaml.safe_load(Path('setup.yml').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match VERSION'
          assert metadata['name'] == 'certbot-httpreq', 'Unexpected package name'
          assert metadata['version'] == metadata['release'] == version
          assert Path('RELEASE').read_text().strip() == version
          assert 'UNRELEASED' not in Path('CHANGELOG').read_text().splitlines()[0], 'Finalize changelog before publishing'
          PY
      - name: Test
        run: |
          python .github/scripts/check-test-collection.py --runner unittest tests
          python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m build packages/core --outdir dist/core
          python -m build --outdir dist/adapter
      - name: Validate distributions
        run: python -m twine check --strict dist/core/* dist/adapter/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-core:
    if: github.event_name == 'release' && !github.event.release.prerelease && github.repository == 'decryptus/acme-http-connector'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/acme-http-connector/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core/

  publish-adapter:
    if: github.event_name == 'release' && !github.event.release.prerelease && github.repository == 'decryptus/acme-http-connector'
    needs: publish-core
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/certbot-httpreq/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish adapter using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/adapter/
