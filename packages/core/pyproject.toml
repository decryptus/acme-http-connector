[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-http-connector"
version = "0.2.1"
description = "Client-independent HTTP API connector for ACME challenges and certificates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Adrien Delle Cave", email = "pypi@doowan.net"}]
dependencies = ["requests>=2.28", "sonicprobe>=0.3.48", "PyYAML>=6"]

[project.scripts]
acme-http-dehydrated = "acme_http_connector.dehydrated:main"

[project.urls]
Documentation = "https://github.com/decryptus/acme-http-connector#configuration"
Issues = "https://github.com/decryptus/acme-http-connector/issues"
Changelog = "https://github.com/decryptus/acme-http-connector/blob/master/CHANGELOG"
Repository = "https://github.com/decryptus/acme-http-connector"

[tool.setuptools.packages.find]
where = ["src"]
